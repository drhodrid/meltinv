name: tests

# Runs the test suite on every push and pull request to GitHub,
# once for each supported Python version.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # report every Python version, even if one fails
      matrix:
        python-version: ["3.11", "3.12"]
    name: tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install meltinv with test dependencies
        run: pip install ".[test]"
      - name: Run tests (including the slow meltPT test)
        env:
          MPLBACKEND: Agg
        run: pytest -m "slow or not slow" -v
